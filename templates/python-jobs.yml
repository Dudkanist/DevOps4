.lint-job:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install flake8
    - mkdir -p reports
    - flake8 src/ tests/ --max-line-length=${MAX_LINE_LENGTH:-100} > reports/flake8.txt
  artifacts:
    paths: [reports/flake8.txt]
    expire_in: 7 days

.test-job:
  stage: test
  script:
    - pip install -r requirements-dev.txt
    - pytest ${TEST_DIRS:-tests/} --junitxml=reports/junit.xml --cov=src --cov-report=html:reports/coverage-html/
  coverage: '/TOTAL.*\s(\d+)%/'
  artifacts:
    when: always
    paths:
      - reports/coverage-html/
    reports:
      junit: reports/junit.xml
    expire_in: 30 days
    expose_as: "Coverage Report"

.docker-build-job:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  script:
    - mkdir -p dist
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker save $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA > dist/image.tar
